name: Build Aerial standard release (Changhong)

# Built on GitHub because the local VM cannot download Gradle dependencies
# (its egress proxy denies the build daemon's connections).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Do NOT use android-actions/setup-android: it fails on current runners
      # (its sdkmanager call requests the removed "tools" package and exits 1).
      # The runner image already ships an Android SDK; just add the packages
      # this project needs.
      - name: Install Android SDK packages
        run: |
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            cd /tmp && curl -sS -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools/latest"
            mv "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools"/* "$ANDROID_HOME/cmdline-tools/latest"/
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Build standard release
        run: ./gradlew assembleStandardRelease --console=plain
      - name: Publish APK to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: changhong-v13-${{ github.run_number }}
          name: Changhong v13 build ${{ github.run_number }}
          files: app/build/outputs/apk/standard/release/*.apk
          fail_on_unmatched_files: true
